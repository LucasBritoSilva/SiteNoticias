name: Atualizar notícias

on:
  schedule:
    # Uma atualização por dia. O GitHub Actions usa UTC:
    # 22:17 UTC = 18:17 em Mato Grosso do Sul (UTC-4) = 19:17 em Brasília (UTC-3).
    # O horário é experimental: não garante que o Gemini esteja disponível.
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Uma execução por vez, inclusive durante a espera de 1 hora; a seguinte (agendada ou manual)
# fica na fila até a atual terminar. Nada é cancelado no meio.
concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    # 2 tentativas de até 15 min + 60 min de espera + folga para preparar e publicar.
    timeout-minutes: 100
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          # A ponta atual da branch, e não o commit de quando a execução foi disparada: quem
          # ficou na fila precisa enxergar o que a execução anterior publicou.
          ref: ${{ github.ref_name }}

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # ÚNICO lugar do projeto com política de nova tentativa: no máximo 2 execuções do script,
      # a segunda só se a primeira falhar, 3600 s depois da falha. O script faz no máximo uma
      # requisição ao Gemini por execução e não repete nada por conta própria.
      # Se as duas falharem, o passo falha, o envio abaixo não roda e o site anterior continua no ar.
      - name: Gerar o site (no máximo 2 tentativas)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set +e  # os códigos de saída são tratados abaixo, um a um
          set -u
          ESPERA_SEGUNDOS=3600
          LIMITE_POR_TENTATIVA=15m

          agora() { date -u +'%Y-%m-%d %H:%M:%S UTC'; }
          registrar() { echo "[$(agora)] $*"; }

          # Devolve docs/ e dados/ ao último commit e confere que não sobrou diferença.
          restaurar() {
            local pasta
            for pasta in docs dados; do
              if [ -n "$(git ls-files -- "$pasta")" ]; then
                git checkout -q HEAD -- "$pasta" || return 1
              fi
            done
            git clean -fdq -- docs dados || return 1
            rm -rf .staging .staging-anterior || return 1
            local sobras
            sobras="$(git status --porcelain -- docs dados)" || return 1
            [ -z "$sobras" ]
          }

          # Executa o script uma vez; devolve o código de saída dele.
          tentar() {
            registrar "Tentativa $1/2: iniciando a geração."
            timeout --kill-after=30s "$LIMITE_POR_TENTATIVA" python -u scripts/main.py
            local codigo=$?
            if [ "$codigo" -eq 0 ]; then
              registrar "Tentativa $1/2: geração concluída."
            elif [ "$codigo" -eq 124 ] || [ "$codigo" -eq 137 ]; then
              registrar "Tentativa $1/2: FALHOU por tempo esgotado ($LIMITE_POR_TENTATIVA; código $codigo)."
            else
              registrar "Tentativa $1/2: FALHOU (código $codigo); o motivo está nas linhas acima."
            fi
            return "$codigo"
          }

          registrar "Início da atualização."
          if tentar 1; then
            registrar "RESULTADO FINAL: sucesso na tentativa 1/2; o site será publicado."
            exit 0
          fi
          falha_em=$(date -u +%s)

          if ! restaurar; then
            echo "::error::[$(agora)] RESULTADO FINAL: falha. Não foi possível restaurar docs/ e dados/; a segunda tentativa não será feita e nada será publicado."
            exit 1
          fi
          registrar "docs/ e dados/ restaurados ao último commit."

          registrar "Início da espera de $ESPERA_SEGUNDOS s; nenhuma chamada ao Gemini até lá."
          registrar "Tentativa 2/2 prevista para $(date -u -d "@$((falha_em + ESPERA_SEGUNDOS))" +'%Y-%m-%d %H:%M:%S UTC')."
          if ! sleep "$ESPERA_SEGUNDOS"; then
            echo "::error::[$(agora)] RESULTADO FINAL: falha. A espera foi interrompida; nada será publicado."
            exit 1
          fi
          registrar "Fim da espera: este é o horário efetivo da tentativa 2/2."

          if tentar 2; then
            registrar "RESULTADO FINAL: sucesso na tentativa 2/2; o site será publicado."
            exit 0
          fi

          if restaurar; then
            registrar "Dados anteriores preservados: docs/ e dados/ sem diferença do último commit."
          else
            echo "::warning::[$(agora)] Não foi possível restaurar docs/ e dados/ neste runner; nada será enviado."
          fi
          echo "::error::[$(agora)] RESULTADO FINAL: as 2 tentativas falharam. Nada será publicado, o site anterior continua no ar e a próxima atualização automática é a do próximo agendamento."
          exit 1

      # Só roda se o passo anterior terminar com sucesso.
      - name: Enviar alterações para a main
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if [ -d dados ]; then git add -A dados; fi  # cache dos resumos (sem segredos)
          if git diff --cached --quiet; then
            echo "Nada mudou em docs/ nem em dados/; nada a enviar."
            exit 0
          fi
          git commit -m "Atualiza notícias ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # A edição de nichos pela página também faz commits na main. Se a branch andou
          # enquanto rodávamos, reaplica o nosso commit por cima (sem sobrescrever nada)
          # e envia de novo. Um conflito de verdade faz o passo falhar.
          # Isto repete só o envio ao GitHub; não gera o site nem chama o Gemini.
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Enviado na tentativa $tentativa."
              exit 0
            fi
            echo "Envio falhou (tentativa $tentativa); aguardando para repetir..."
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 10))
          done
          echo "Não foi possível enviar as alterações." >&2
          exit 1
