name: Atualizar notícias

on:
  schedule:
    # Cuiabá é UTC-4 (sem horário de verão); o GitHub Actions usa UTC.
    - cron: "40 0 * * *"   # 00:40 UTC = 20:40 em Cuiabá (do dia anterior)
    - cron: "5 9 * * *"    # 09:05 UTC = 05:05 em Cuiabá
    - cron: "5 21 * * *"   # 21:05 UTC = 17:05 em Cuiabá
  workflow_dispatch:
    inputs:
      retry:
        description: "Execução de retentativa (não agenda outra)"
        type: boolean
        default: false

permissions:
  contents: write

# Uma execução por vez; a seguinte espera a atual terminar (nada é cancelado no meio).
concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.gerar.outputs.codigo }}
    # Teto de segurança: o pipeline roda uma vez só (Gemini: no máximo 2 requisições em até 5 min).
    timeout-minutes: 90
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # O script roda o pipeline uma vez; só o Gemini tem uma nova tentativa curta (503/rede/timeout).
      # Ele só altera docs/ se a execução terminar com sucesso; se falhar, o passo falha,
      # o próximo passo não roda e a versão anterior do site continua no ar.
      # Saída 75 = Gemini indisponível (503/timeout): o job "reagendar" tenta de novo em 1 hora.
      - name: Gerar o site
        id: gerar
        run: |
          set +e
          python scripts/main.py
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          exit $codigo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      - name: Enviar alterações para a main
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if [ -d dados ]; then git add -A dados; fi  # cache dos resumos (sem segredos)
          if git diff --cached --quiet; then
            echo "Nada mudou em docs/ nem em dados/; nada a enviar."
            exit 0
          fi
          git commit -m "Atualiza notícias ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # A edição de nichos pela página também faz commits na main. Se a branch andou
          # enquanto rodávamos, reaplica o nosso commit por cima (sem sobrescrever nada)
          # e tenta de novo. Um conflito de verdade faz o passo falhar.
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Enviado na tentativa $tentativa."
              exit 0
            fi
            echo "Envio falhou (tentativa $tentativa); aguardando para repetir..."
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 10))
          done
          echo "Não foi possível enviar as alterações." >&2
          exit 1

  # UMA retentativa em 1 hora, só quando o Gemini ficou indisponível (saída 75: 503/timeout).
  # A execução disparada aqui leva retry=true e por isso nunca agenda outra: não há laço.
  # Enquanto este job espera, o grupo de concorrência fica ocupado; o menor intervalo entre
  # agendamentos (21:05 -> 00:40 UTC) é de 3h35, então a espera de ~1h10 não atrasa nenhum deles.
  reagendar:
    needs: atualizar
    if: failure() && needs.atualizar.outputs.codigo == '75' && github.event.inputs.retry != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
    steps:
      - name: Aguardar 1 hora e disparar a retentativa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3600
          gh workflow run atualizar-site.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f retry=true
          echo "Retentativa disparada (retry=true)."
